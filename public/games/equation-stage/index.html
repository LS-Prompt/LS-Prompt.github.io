<html lang="ko">

  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  body { font-family: system-ui, "Noto Sans KR", sans-serif; }
</style>
</head>
<body>
<canvas id="game" aria-label="관제센터 X 게임 화면"></canvas>
<script>
/* =====================================================================
 * 관제센터 X — 식을 세워 작전을 지휘하는 문장제 미션 게임
 * 구조: CONFIG → 유리수/일차식 → MISSION 데이터 → state → 진행 로직 → input → sfx → update → render → loop
 * 기획: studio/games/equation-stage/gdd.md (v0.2)
 * ===================================================================== */

// ---- CONFIG (GDD 7장 수치 표와 1:1) ----
const CONFIG = {
  title: '관제센터 X',
  storageKey: 'equation-stage-progress',
  playDuration: 2.6, simDuration: 1.6, playDurationMax: 4.0,     // s
  playScaleMin: 0.35, playScaleMax: 1.3, overshootFactor: 3, trackMargin: 1.2,
  resultHold: 0.6,          // s
  rankPoints: { S: 4, A: 3, B: 2, C: 1 },
  rankOperator: 10, rankSenior: 24, rankChief: 40,
  maruWrongRate: 0.7,
  dialogCharsPerSec: 40, dialogMaxLines: 2,
  lightUpDuration: 1.8,     // s
  approveHold: 0.4,         // s, 승인 버튼을 누르고 있어야 하는 시간
  cardMinSize: 48, cardSnapTime: 0.14, dragThreshold: 8, dropPadding: 14,
  celebrateParticles: 28, shakeOnMismatch: 6, fontMin: 16,
  designHeight: 720, columnMax: 560,
  colors: {
    bg: '#0E1626', panel: '#17233B', grid: '#24324F', ink: '#E8EEF7', dim: '#8A97AD',
    unit: '#4FC3D9', target: '#FF7A59', amber: '#F2B134', good: '#5CC98A', bad: '#FF5C5C',
  },
  audio: { volume: 0.3 },
};
const C = CONFIG.colors;

// ---- 유리수와 일차식 ----
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const R = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
const rAdd = (p, q) => R(p.n * q.d + q.n * p.d, p.d * q.d);
const rSub = (p, q) => R(p.n * q.d - q.n * p.d, p.d * q.d);
const rMul = (p, q) => R(p.n * q.n, p.d * q.d);
const rDiv = (p, q) => R(p.n * q.d, p.d * q.n);
const rEq = (p, q) => p.n === q.n && p.d === q.d;
const rNum = (p) => p.n / p.d;
const rFmt = (p) => (p.n < 0 ? '−' : '') + Math.abs(p.n) + (p.d === 1 ? '' : '/' + p.d);
const L = (a, b) => ({ a, b });                                   // a·x + b
const ZERO = R(0), ONE = R(1);
const signed = (op, r) => (op === '−' ? rSub(ZERO, r) : r);
function normalize(eq) { return { A: rSub(eq.lhs.a, eq.rhs.a), B: rSub(eq.rhs.b, eq.lhs.b) }; }
function solve(eq) {
  const { A, B } = normalize(eq);
  if (A.n === 0) return { kind: B.n === 0 ? 'infinite' : 'none' };
  return { kind: 'unique', x: rDiv(B, A) };
}
function equivalent(e1, e2) {
  const p = normalize(e1), q = normalize(e2);
  if ((p.A.n === 0 && p.B.n === 0) || (q.A.n === 0 && q.B.n === 0)) return false;
  return rSub(rMul(p.A, q.B), rMul(q.A, p.B)).n === 0;
}
const trim = (v, k = 2) => String(Math.round(v * 10 ** k) / 10 ** k);
const fmtKm = (v) => trim(v) + ' km';
const fmtTime = (h) => (h * 60 >= 120 ? trim(h, 1) + '시간' : trim(h * 60, 1) + '분');

// ---- 미션 1: 혈청 드론 추격 (따라잡기) ----
// p = { v1: 구급차 시속, d: 드론 출발 시차(분), v2: 드론 시속, h: 병원까지 km }
const MISSION = {
  id: 'm1', name: '혈청 드론 추격', type: '따라잡기',
  paramSets: {
    train: [{ v1: 60, d: 10, v2: 90, h: 40 }],
    live: [{ v1: 60, d: 10, v2: 90, h: 40 }, { v1: 48, d: 15, v2: 72, h: 50 }, { v1: 40, d: 12, v2: 60, h: 30 }],
    twist: [{ v1: 60, d: 10, v2: 75, h: 40 }],
  },
  call: {
    train: (p) => [
      ['lead', `구급차가 혈청을 두고 출발했어. 지금 시속 ${p.v1} km로 병원에 가는 중이다.`],
      ['lead', `${p.d}분 늦게 드론을 띄울 수 있어. 드론은 시속 ${p.v2} km, 병원은 ${p.h} km 지점.`],
      ['lead', '드론이 구급차를 언제, 어디서 따라잡는지 식으로 세워 봐.'],
    ],
    live: (p) => [
      ['lead', '또 혈청 호출이다. 이번엔 조건이 달라. 숫자를 잘 봐.'],
      ['maru', '제가 먼저 식을 세워 봤어요! 맞는지 모의 실행으로 봐 주세요.'],
    ],
    twist: (p) => [
      ['lead', `맞바람이 분다. 드론 속력이 시속 ${p.v2} km로 떨어졌어.`],
      ['lead', '식을 세우고, 그 답이 상황에 맞는지까지 확인해.'],
    ],
  },
  cards: (p) => [
    { id: 'v1', base: R(p.v1), cap: '구급차 시속' },
    { id: 'd', base: R(p.d), cap: '분 늦게' },
    { id: 'v2', base: R(p.v2), cap: '드론 시속' },
    { id: 'h', base: R(p.h), cap: '병원 km' },
  ],
  // 풀 수 있는 미지수마다 식 틀이 다르다. roles: 수 슬롯이 뜻하는 값, op: 올바른 연산
  unknowns: [
    { label: '드론이 난 시간', short: 'x = 드론이 난 시간(시간)', relSet: 0,
      frame: [{ num: 0 }, '×', '(', 'x', { op: 0 }, { num: 1 }, ')', '=', { num: 2 }, '×', 'x'],
      roles: ['v1', 'delay', 'v2'], op: '+',
      build: (n, o) => ({ lhs: L(n[0], rMul(n[0], signed(o[0], n[1]))), rhs: L(n[2], ZERO) }),
      toT: (x, p) => x },
    { label: '구급차가 달린 시간', short: 'x = 구급차가 달린 시간(시간)', relSet: 0,
      frame: [{ num: 0 }, '×', 'x', '=', { num: 1 }, '×', '(', 'x', { op: 0 }, { num: 2 }, ')'],
      roles: ['v1', 'v2', 'delay'], op: '−',
      build: (n, o) => ({ lhs: L(n[0], ZERO), rhs: L(n[1], rMul(n[1], signed(o[0], n[2]))) }),
      toT: (x, p) => x - p.d / 60 },
    { label: '만나는 지점까지의 거리', short: 'x = 만나는 지점까지의 거리(km)', relSet: 1,
      frame: ['x', '/', { num: 0 }, { op: 0 }, 'x', '/', { num: 1 }, '=', { num: 2 }],
      roles: ['v1', 'v2', 'delay'], op: '−',
      build: (n, o) => ({ lhs: L(rAdd(rDiv(ONE, n[0]), signed(o[0], rDiv(ONE, n[1]))), ZERO), rhs: L(ZERO, n[2]) }),
      toT: (x, p) => x / p.v2 },
    { label: '병원까지의 거리', invalid: '그건 이미 알고 있는 값이야. 아직 모르는 것을 x로 놓아야 해.' },
  ],
  relSets: [
    [ { t: '두 대가 움직인 시간이 같다', why: (p) => `구급차가 ${p.d}분 먼저 출발했어. 만날 때까지 걸린 시간이 같을 수 있을까?` },
      { t: '두 대가 간 거리가 같다', ok: true },
      { t: (p) => `두 대가 간 거리의 합이 ${p.h} km다`, why: () => '둘은 같은 방향으로 가고 있어. 거리를 합칠 이유가 있을까?' } ],
    [ { t: '걸린 시간이 같다', why: (p) => `구급차가 ${p.d}분 먼저 출발했어. 같은 지점까지 걸린 시간이 같을까?` },
      { t: (p) => `두 대가 간 거리의 합이 ${p.h} km다`, why: () => '둘은 같은 방향으로 가고 있어. 거리를 합칠 이유가 있을까?' },
      { t: (p) => `걸린 시간의 차가 ${p.d}분이다`, ok: true } ],
  ],
  // 대표 오답 (함정 도감)
  traps: {
    minutes: { name: '분을 그대로 넣기', why: '속력이 시속이면 시간도 시간 단위여야 한다.',
      hint: (p) => `속력이 시속이야. ${p.d}분은 몇 시간이지?`, maru: '어… 드론이 몇 시간이나 날아가는데요?' },
    wrongconv: { name: '거꾸로 변환하기', why: '분을 시간으로 바꾸려면 60으로 나눈다.',
      hint: (p) => `${p.d}분에 60을 곱하면 초가 돼. 시간으로 바꾸려면 어떻게 해야 하지?`, maru: '숫자가 엄청 커졌어요!' },
    reversed: { name: '시간 관계를 거꾸로', why: '먼저 출발한 쪽이 더 오래 움직였다.',
      hint: () => '먼저 출발한 쪽이 더 오래 달렸어. 구급차의 시간은 드론보다 길까, 짧을까?', maru: '시간이… 음수가 나와요?' },
    swapped: { name: '속력을 바꿔 넣기', why: '어느 쪽의 속력인지 짝을 맞춰야 한다.',
      hint: () => '어느 쪽이 먼저 출발했고, 그쪽 속력은 얼마지?', maru: '드론이랑 구급차가 뒤바뀐 것 같아요.' },
    extra: { name: '필요 없는 값 넣기', why: '문제에 나온 수가 모두 식에 필요한 것은 아니다.',
      hint: (p) => `${p.h} km는 무엇의 거리지? 지금 식에 필요한 값일까?`, maru: '그 숫자, 병원 거리 아니에요?' },
  },
  positionsAt: (p, t) => ({ target: p.v1 * (t + p.d / 60), unit: p.v2 * t }),
};
const TRAP_IDS = Object.keys(MISSION.traps);
const STAGES = [
  { key: 'train', name: '훈련', desc: '팀장의 안내를 받으며 식 세우기' },
  { key: 'live', name: '실전', desc: '바뀐 숫자, 마루의 식 검증하기' },
  { key: 'twist', name: '돌발', desc: '맞바람 — 답이 상황에 맞는지 판단' },
];
const INTRO = [
  ['sys', '밤 11시 40분. 모아시 전역에 대정전이 일어났다.'],
  ['lead', '수습, 첫 근무부터 큰일이군. 나는 한솔 팀장이다.'],
  ['lead', '예측 시스템이 전부 꺼졌어. 이제 미래는 우리가 직접 계산해야 해. 식을 세워서.'],
  ['maru', '안녕하세요, 보조 AI 마루예요! 기억 장치가 좀… 깨졌지만 도울게요!'],
  ['lead', '마루의 말은 꼭 검증하고 써. 첫 호출이 들어왔다. 지도를 열어.'],
];
const WHO = { lead: { name: '한솔 팀장', color: C.amber }, maru: { name: '마루', color: C.unit }, sys: { name: '', color: C.dim } };

// ---- 저장 ----
function loadSave() {
  const base = { grades: {}, codex: [], maru: 0, seenIntro: false, muted: false };
  try { return Object.assign(base, JSON.parse(localStorage.getItem(CONFIG.storageKey)) || {}); } catch { return base; }
}
function persist() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state.save)); } catch {} }

// ---- state ----
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, K = 1;
const state = {
  scene: 'title',     // title | intro | city | call | brief1 | brief2 | build | sim | exec | judge | debrief | codex
  time: 0, score: 0,  // score = 계급 점수
  save: loadSave(),
  citySel: 0, hidden: false,
  m: null,            // 진행 중인 미션 단계
  dialog: null, anim: null, hold: null, drag: null,
  shake: 0, lock: 0, particles: [], buttons: [], slotRects: [], lastParams: {},
  lightUp: 0,
};
const gradeKey = (stage) => `${MISSION.id}-${stage}`;
const stageUnlocked = (i) => i === 0 || !!state.save.grades[gradeKey(STAGES[i - 1].key)];
const stagesDone = () => STAGES.filter((s) => state.save.grades[gradeKey(s.key)]).length;
function recalcScore() { state.score = Object.values(state.save.grades).reduce((a, g) => a + CONFIG.rankPoints[g], 0); }
function rankName() {
  const s = state.score;
  return s >= CONFIG.rankChief ? '수석 관제사' : s >= CONFIG.rankSenior ? '선임 관제사' : s >= CONFIG.rankOperator ? '관제사' : '수습 관제사';
}
recalcScore();

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = canvas.clientWidth || window.innerWidth, ch = canvas.clientHeight || window.innerHeight;
  K = Math.min(1, ch / CONFIG.designHeight);
  W = cw / K; H = ch / K;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
}
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);

// ---- 대사 ----
function say(lines, onDone) {
  state.dialog = { lines: lines.map(([who, text]) => ({ who, text })), i: 0, chars: 0, onDone };
  sfx.play('radio');
}
function advanceDialog(skipAll) {
  const d = state.dialog; if (!d) return;
  const cur = d.lines[d.i];
  if (!skipAll && d.chars < cur.text.length) { d.chars = cur.text.length; return; }
  if (!skipAll && d.i + 1 < d.lines.length) { d.i++; d.chars = 0; sfx.play('radio'); return; }
  state.dialog = null;
  if (d.onDone) d.onDone();
}

// ---- 미션 진행 ----
function startStage(key) {
  const sets = MISSION.paramSets[key];
  let pi = Math.floor(Math.random() * sets.length);
  if (sets.length > 1 && pi === state.lastParams[key]) pi = (pi + 1) % sets.length;
  state.lastParams[key] = pi;
  const p = sets[pi];
  state.m = {
    stage: key, p, unknown: null, relOK: false,
    cards: MISSION.cards(p).map((c) => ({ ...c, val: c.base, conv: null, where: 'hand', x: W / 2, y: H + 60, w: 80, h: 60, tx: W / 2, ty: H + 60, tw: 80, th: 60 })),
    nums: [], ops: [], sims: 0, approvals: 0, helped: false, newCodex: [], maruPiece: false,
    sceneT: 0, ghost: true, readout: null, convMode: false, convSel: null, direct: false, judge: null,
  };
  state.anim = null; state.scene = 'call';
  say(MISSION.call[key](p), () => {
    if (key === 'live') maruProposal(); else state.scene = 'brief1';
  });
  sfx.play('alarm');
}
const U = () => MISSION.unknowns[state.m.unknown];
const card = (id) => state.m.cards.find((c) => c.id === id);
const slotsFull = () => state.m.nums.length > 0 && state.m.nums.every((s) => s !== null) && state.m.ops.every((o) => o !== null);

function chooseUnknown(i) {
  const m = state.m, u = MISSION.unknowns[i];
  if (!u || (state.scene !== 'brief1')) return;
  if (u.invalid) { say([['lead', u.invalid]]); return; }
  setUnknown(i);
  state.scene = 'brief2'; sfx.play('place');
}
function setUnknown(i) {
  const m = state.m, u = MISSION.unknowns[i];
  m.unknown = i; m.relOK = false;
  m.cards.forEach((c) => { c.where = 'hand'; });
  m.nums = new Array(u.frame.filter((t) => t.num !== undefined).length).fill(null);
  m.ops = new Array(u.frame.filter((t) => t.op !== undefined).length).fill(null);
  m.sceneT = 0; m.readout = null;
}
function chooseRelation(i) {
  const m = state.m; if (state.scene !== 'brief2') return;
  const rel = MISSION.relSets[U().relSet][i]; if (!rel) return;
  if (!rel.ok) { if (m.stage !== 'train') m.helped = true; say([['lead', rel.why(m.p)]]); return; }
  m.relOK = true; state.scene = 'build'; sfx.play('place');
}
// 실전: 마루가 식을 먼저 채워 둔다
function maruProposal() {
  const m = state.m;
  setUnknown(0); m.relOK = true;
  const wrong = Math.random() < CONFIG.maruWrongRate;
  const kind = wrong ? ['minutes', 'reversed', 'swapped', 'extra'][Math.floor(Math.random() * 4)] : 'ok';
  m.maruKind = kind;
  if (kind !== 'minutes' && kind !== 'extra') convert('d', '÷60', true);
  const fill = { ok: ['v1', 'd', 'v2'], minutes: ['v1', 'd', 'v2'], reversed: ['v1', 'd', 'v2'], swapped: ['v2', 'd', 'v1'], extra: ['v1', 'h', 'v2'] }[kind];
  fill.forEach((id, i) => { m.nums[i] = id; card(id).where = i; });
  m.ops[0] = kind === 'reversed' ? '−' : '+';
  state.scene = 'build';
}

function placeCard(id, slotIndex) {
  const m = state.m, c = card(id);
  if (!c || state.scene !== 'build') return;
  if (slotIndex === undefined) { slotIndex = m.nums.indexOf(null); if (slotIndex < 0) slotIndex = m.nums.length - 1; }
  if (c.where !== 'hand') m.nums[c.where] = null;
  const prev = m.nums[slotIndex];
  if (prev && prev !== id) card(prev).where = 'hand';
  m.nums[slotIndex] = id; c.where = slotIndex;
  m.sceneT = 0; m.readout = null; sfx.play('place');
}
function removeCard(id) {
  const m = state.m, c = card(id);
  if (!c || c.where === 'hand' || state.scene !== 'build') return;
  m.nums[c.where] = null; c.where = 'hand'; m.sceneT = 0; m.readout = null; sfx.play('pick');
}
function setOp(i, op) {
  const m = state.m; if (state.scene !== 'build') return;
  m.ops[i] = op !== undefined ? op : (m.ops[i] === '+' ? '−' : '+');
  m.sceneT = 0; m.readout = null; sfx.play('place');
}
function convert(id, mode, silent) {
  const c = card(id); if (!c) return;
  c.conv = mode || null;
  c.val = mode === '÷60' ? rDiv(c.base, R(60)) : mode === '×60' ? rMul(c.base, R(60)) : c.base;
  if (state.m) { state.m.sceneT = 0; state.m.readout = null; }
  if (!silent) sfx.play('convert');
}

// 현재 식을 평가한다
function evaluate() {
  const m = state.m, u = U(), p = m.p;
  const vals = m.nums.map((id) => card(id).val);
  const eq = u.build(vals, m.ops);
  const want = { v1: R(p.v1), v2: R(p.v2), delay: R(p.d, 60) };
  const correctEq = u.build(u.roles.map((r) => want[r]), [u.op]);
  const sol = solve(eq);
  const res = { correct: equivalent(eq, correctEq), sol, trap: null, t: null, kind: 'mismatch' };
  if (!res.correct) {
    const by = {}; u.roles.forEach((r, i) => { by[r] = vals[i]; });
    if (vals.some((v) => rEq(v, R(p.h)))) res.trap = 'extra';
    else if (rEq(by.v1, R(p.v2)) && rEq(by.v2, R(p.v1))) res.trap = 'swapped';
    else if (rEq(by.delay, R(p.d))) res.trap = 'minutes';
    else if (rEq(by.delay, R(p.d * 60))) res.trap = 'wrongconv';
    else if (m.ops[0] !== u.op) res.trap = 'reversed';
  }
  if (sol.kind !== 'unique') res.kind = 'undetermined';
  else {
    res.t = u.toT(rNum(sol.x), p);

// ---- input ----
window.addEventListener('keydown', (e) => {

  }

  else if (state.scene === 'city' && (k === 'ArrowUp' || k === 'ArrowLeft')) state.citySel = (state.citySel + STAGES.length - 1) % STAGES.length;
  else if (/^[1-9]$/.test(k)) {

    else if (state.scene === 'judge') chooseJudge(n);

const pt = (e) => { const b = canvas.getBoundingClientRect(); return { x: (e.clientX - b.left) / K, y: (e.clientY - b.top) / K }; };

// ---- sfx ----
const sfx = {
  ac: null,
  unlock() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } this.ac?.resume?.(); },
  tone(f0, f1, dur, type, delay = 0, vol = 1) {

  },
  play(name) {

    const seq = (fs, step, dur, type, vol) => fs.forEach((f, i) => this.tone(f, f, dur, type, i * step, vol));
    if (name === 'pick') this.tone(520 * j, 620 * j, 0.06, 'triangle');
    else if (name === 'place') this.tone(440 * j, 330 * j, 0.08, 'triangle');

    else if (name === 'lock') this.tone(180, 120, 0.3, 'sawtooth', 0, 0.5);
    else if (name === 'success') seq([523, 659, 784], 0.13, 0.16, 'sine', 1);

// ---- update ----
function burst() {
  const sc = state.sceneRect || { x: W / 2, y: H / 3, w: 0, h: 0 };
  for (let i = 0; i < CONFIG.celebrateParticles; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220;
    state.particles.push({ x: sc.x + sc.w / 2, y: sc.y + sc.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.9 + Math.random() * 0.5,
      color: [C.amber, C.good, C.unit, C.target][i % 4] });
  }
}
function update(dt) {
  if (state.hidden) return;
  state.time += dt;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 24);
  if (state.lock > 0) state.lock = Math.max(0, state.lock - dt * 1.2);
  if (state.lightUp > 0) state.lightUp = Math.max(0, state.lightUp - dt);
  for (const q of state.particles) { q.life -= dt; q.vy += 520 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  state.particles = state.particles.filter((q) => q.life > 0);
  if (state.dialog) { state.dialog.chars += dt * CONFIG.dialogCharsPerSec; return; }
  if (state.hold) { state.hold.t += dt; if (state.hold.t >= CONFIG.approveHold) { const h = state.hold; state.hold = null; h.onDone(); } }
  if (state.anim) {
    const a = state.anim;
    a.t = Math.min(a.dur, a.t + dt);
    const u = a.t / a.dur, ease = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    state.m.sceneT = ease * a.x;
    if (a.t >= a.dur) { a.hold -= dt; if (a.hold <= 0) { state.anim = null; a.onEnd(); } }
  }
  if (state.m) {
    const f = Math.min(1, dt / CONFIG.cardSnapTime);
    for (const c of state.m.cards) {
      if (state.drag && state.drag.id === c.id && state.drag.moved) continue;
      c.x += (c.tx - c.x) * f; c.y += (c.ty - c.y) * f; c.w += (c.tw - c.w) * f; c.h += (c.th - c.h) * f;
    }
  }
}

const BUILDINGS = (() => {          // 고정된 난수로 건물을 배치한다
  let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  return Array.from({ length: 46 }, () => ({ x: rnd(), w: 0.03 + rnd() * 0.04, h: 0.25 + rnd() * 0.6, win: Array.from({ length: 6 }, rnd) }));
})();

  BUILDINGS.forEach((b, i) => {

    ctx.fillStyle = '#131D31'; ctx.fillRect(bx, y + h - bh, bw, bh);
    b.win.forEach((r, k) => {
      const on = (i * 7 + k * 13) % 100 < lit * 100;

      ctx.fillRect(bx + 3 + (k % 2) * (bw / 2 - 1), y + h - bh + 5 + Math.floor(k / 2) * (bh / 4), 3, 4);
    });
    ctx.globalAlpha = 1;
  });
}

// 작전 장면: 직선 도로 (2D). positionsAt(t)은 3D 장면에서도 그대로 쓴다
function renderScene(r) {
  const m = state.m, p = m.p;
  state.sceneRect = r;
  rr(r.x, r.y, r.w, r.h, 14, '#0B1220', state.lock > 0 ? C.bad : C.grid, state.lock > 0 ? 3 : 1.5);
  ctx.save(); ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.clip();
  const maxKm = Math.max(p.h, m.stage === 'twist' ? MISSION.positionsAt(p, trueT()).unit : 0) * CONFIG.trackMargin;
  const x0 = r.x + 30, x1 = r.x + r.w - 22, gy = r.y + r.h * 0.5 + 6;
  const px = (km) => x0 + (km / maxKm) * (x1 - x0);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(r.x + r.w + 20, gy); ctx.stroke();
  for (let km = 0; km <= maxKm + 1e-9; km += 10) {
    ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px(km), gy + 8); ctx.lineTo(px(km), gy + 14); ctx.stroke();
    text(String(km), px(km), gy + 26, 13, C.dim, 'center');
  }
  text('km', r.x + r.w - 10, gy + 44, 12, C.dim, 'right');
  // 관제센터(출발지)와 병원
  rr(x0 - 9, gy - 20, 18, 16, 3, C.grid, C.dim); text('X', x0, gy - 12, 11, C.amber, 'center', 800);
  const hx = px(p.h);
  rr(hx - 11, gy - 30, 22, 24, 4, '#1D2B47', C.ink); text('+', hx, gy - 18, 18, C.bad, 'center', 800);
  text('병원', hx, gy - 42, 13, C.ink, 'center', 700);
  // 유닛
  let pos = MISSION.positionsAt(p, m.sceneT);
  if (m.direct) pos = { target: Math.min(pos.target, p.h), unit: Math.min(pos.unit, p.h) };
  const tx = px(pos.target), ux = px(pos.unit), off = (x) => x > r.x + r.w + 12;
  const ghost = m.ghost && m.sceneT > 0;
  ctx.globalAlpha = ghost ? 0.55 : 1;
  if (m.sceneT > 0) {                                   // 지나온 길
    ctx.setLineDash(ghost ? [5, 5] : []); ctx.lineWidth = 3;
    ctx.strokeStyle = C.target; ctx.beginPath(); ctx.moveTo(px(p.v1 * p.d / 60), gy); ctx.lineTo(Math.min(tx, r.x + r.w), gy); ctx.stroke();
    ctx.strokeStyle = C.unit; ctx.beginPath(); ctx.moveTo(x0, gy - 34); ctx.lineTo(Math.min(ux, r.x + r.w), gy - 34); ctx.stroke();
    ctx.setLineDash([]);
  }
  const met = Math.abs(pos.unit - pos.target) < 1e-9 && m.sceneT > 0;
  if (!off(ux)) {                                       // 드론: 각진 모양, 길 위를 난다
    ctx.strokeStyle = C.unit; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(ux, gy - 26); ctx.lineTo(ux, gy - 4); ctx.stroke(); ctx.setLineDash([]);
    const dy = gy - 34 + (state.anim ? Math.sin(state.time * 16) * 1.5 : 0);
    ctx.fillStyle = C.unit; ctx.beginPath(); ctx.moveTo(ux + 10, dy); ctx.lineTo(ux - 8, dy - 7); ctx.lineTo(ux - 8, dy + 7); ctx.closePath(); ctx.fill();
    ctx.fillRect(ux - 12, dy - 10, 9, 2.5); ctx.fillRect(ux + 2, dy - 10, 9, 2.5);
  }
  if (!off(tx)) {                                       // 구급차: 둥근 모양
    rr(tx - 12, gy - 9, 24, 15, 6, C.target); ctx.fillStyle = C.bg; ctx.fillRect(tx - 1.5, gy - 6, 3, 9); ctx.fillRect(tx - 4.5, gy - 3, 9, 3);
  }
  ctx.globalAlpha = 1;
  if (met && !off(ux)) { ctx.strokeStyle = C.good; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ux, gy - 16, 24, 0, 7); ctx.stroke(); }
  ctx.restore();
  if (off(ux)) text(`드론 → ${fmtKm(pos.unit)}`, r.x + r.w - 12, r.y + 38, 14, C.unit, 'right', 700);
  if (off(tx)) text(`구급차 → ${fmtKm(pos.target)}`, r.x + r.w - 12, r.y + 56, 14, C.target, 'right', 700);
  text(`드론 출발 후 ${fmtTime(m.sceneT)}`, r.x + 12, r.y + 18, 15, C.ink, 'left', 700);
  if (state.scene === 'sim') text('모의 실행', r.x + r.w - 12, r.y + 18, 14, C.unit, 'right', 700);
  if (state.scene === 'exec') text('작전 실행 중', r.x + r.w - 12, r.y + 18, 14, C.amber, 'right', 700);
  if (m.readout && state.scene !== 'sim' && state.scene !== 'exec') {
    const col = m.readout.kind === 'correct' ? C.good : m.readout.kind === 'mismatch' ? C.ink : C.bad;
    const n = m.readout.lines.length;
    m.readout.lines.forEach((ln, i) => text(ln, r.x + 12, r.y + r.h - 14 - (n - 1 - i) * 20, 14, i === 0 ? C.dim : i === n - 1 ? col : C.ink, 'left', i === 0 ? 500 : 700));
  }
}

function renderFrame(r) {
  const m = state.m, u = U();
  const slotW = 62, slotH = 50, opW = 44, gap = 5;
  setFont(22, 700);
  const widths = u.frame.map((t) => (t.num !== undefined ? slotW : t.op !== undefined ? opW : ctx.measureText(t).width));
  const total = widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1);
  const sc = Math.min(1, r.w / total);
  let x = r.x + (r.w - total * sc) / 2 + (state.shake ? Math.sin(state.time * 60) * state.shake : 0);
  const cy = r.y + r.h / 2;
  state.slotRects = [];
  u.frame.forEach((t, i) => {
    const w = widths[i] * sc;
    if (t.num !== undefined) {
      const rect = { x, y: cy - slotH * sc / 2, w, h: slotH * sc };
      state.slotRects[t.num] = rect;
      rr(rect.x, rect.y, rect.w, rect.h, 9, 'rgba(255,255,255,0.03)', C.dim, 1.5, [5, 4]);
      if (m.nums[t.num] === null) text('?', x + w / 2, cy, 20, C.dim, 'center', 700);
    } else if (t.op !== undefined) {
      const v = m.ops[t.op];
      rr(x, cy - 22 * sc, w, 44 * sc, 22 * sc, v ? C.panel : 'transparent', v ? C.amber : C.dim, 1.5, v ? null : [5, 4]);

    } else text(t, x + w / 2, cy, 22 * sc, C.ink, 'center', 700);
    x += w + gap * sc;

}
// 카드 목표 위치와 그리기
function renderCards(handRect, hidden) {
  const m = state.m, hand = m.cards.filter((c) => c.where === 'hand'), gap = 8;
  const cw = Math.min(84, (handRect.w - gap * 3) / 4);
  const rowW = hand.length * cw + (hand.length - 1) * gap;
  hand.forEach((c, i) => { c.tx = handRect.x + (handRect.w - rowW) / 2 + i * (cw + gap); c.ty = hidden ? H + 60 : handRect.y; c.tw = cw; c.th = 60; });
  m.cards.forEach((c) => { if (c.where !== 'hand') { const s = state.slotRects[c.where]; if (s) { c.tx = s.x + 2; c.ty = s.y + 2; c.tw = s.w - 4; c.th = s.h - 4; } } });
  const dragging = state.drag && state.drag.moved ? state.drag.id : null;
  [...m.cards].sort((a, b) => (a.id === dragging) - (b.id === dragging)).forEach((c) => {
    const inSlot = c.where !== 'hand', sel = m.convMode && m.convSel === c.id;
    if (c.id === dragging) { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6; }
    rr(c.x, c.y, c.w, c.h, 9, C.panel, sel ? C.amber : c.conv ? C.amber : C.ink, sel ? 3 : 2);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    if (inSlot || c.h < 54) text(rFmt(c.val), c.x + c.w / 2, c.y + c.h / 2 + 1, 18, c.conv ? C.amber : C.ink, 'center', 700);
    else {
      text(rFmt(c.val), c.x + c.w / 2, c.y + 22, 20, c.conv ? C.amber : C.ink, 'center', 700);
      text(c.conv ? `${rFmt(c.base)} ${c.conv}` : c.cap, c.x + c.w / 2, c.y + 45, 12, C.dim, 'center');
    }
  });
}

  if (line.who !== 'sys') { avatar(line.who, col.x + 40, y + h / 2, 44); tx = col.x + 78; text(who.name, tx, y + 20, 14, who.color, 'left', 700); }
  let left = shown.length;
  lines.forEach((ln, i) => { const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1; text(part, tx, y + (line.who === 'sys' ? 30 : 46) + i * 26, 17, line.who === 'sys' ? C.amber : C.ink, 'left', line.who === 'sys' ? 700 : 500); });
  if (d.chars >= line.text.length && Math.sin(state.time * 6) > 0) text('▼', col.x + col.w - 20, y + h - 16, 13, C.dim, 'center');
  state.buttons = [];
  if (d.lines.length > 2) button('skip', col.x + col.w - 96, y - 44, 96, 38, '건너뛰기', () => advanceDialog(true), { fill: C.panel, stroke: C.dim, color: C.dim, size: 14 });
}

function render() {
  state.buttons = [];
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const s = state.scene;
  if (s === 'title') renderTitle();
  else if (s === 'intro') { skyline(0, H * 0.4, W, H * 0.4, 0.03); ctx.fillStyle = '#0A111E'; ctx.fillRect(0, H * 0.8, W, H * 0.2); }
  else if (s === 'city') renderCity();
  else if (s === 'codex') renderCodex();
  else if (s === 'debrief') renderDebrief();
  else renderMission();
  for (const q of state.particles) { ctx.globalAlpha = Math.min(1, q.life); ctx.fillStyle = q.color; ctx.fillRect(q.x - 4, q.y - 4, 8, 8); }
  ctx.globalAlpha = 1;
  if (state.dialog) renderDialog();
}

// ---- loop ----
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// 디버그 핸들 (플레이테스트 자동화용)
window.__game = { CONFIG, state, MISSION, STAGES, api: { startStage, chooseUnknown, chooseRelation, placeCard, removeCard, setOp, convert, simulate, approve, chooseJudge, advanceDialog, askLead, evaluate, nextAfterDebrief, primaryAction } };
</script>
