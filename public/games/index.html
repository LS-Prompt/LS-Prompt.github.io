<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>게임 아케이드</title>
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --dim: #64748b; --line: #e2e8f0; --accent: #0d9488; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1020; --card: #171a2e; --text: #f8fafc; --dim: #94a3b8; --line: #262a44; --accent: #5eead4; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Noto Sans KR", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; } p.sub { color: var(--dim); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  a.card { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .t { font-weight: 700; font-size: 18px; } .d { color: var(--dim); margin-top: 6px; font-size: 15px; } .k { color: var(--accent); margin-top: 10px; font-size: 13px; }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>게임 아케이드</h1>
  <p class="sub">Claude Code 게임 스튜디오에서 만든 게임들</p>
  <ul id="list"></ul>
</main>
<script>
  // /release 스킬이 여기에 항목을 추가한다.
  const GAMES = [
    // { slug: 'neon-drift', title: '네온 드리프트', desc: '한 줄 설명', controls: '← → / 드래그' },
  ];
  const list = document.getElementById('list');
  if (!GAMES.length) list.outerHTML = '<p class="empty">아직 출시된 게임이 없습니다.</p>';
  for (const g of GAMES) {
    const li = document.createElement('li');
    li.innerHTML = `<a class="card" href="./${g.slug}/"><div class="t"></div><div class="d"></div><div class="k"></div></a>`;
    li.querySelector('.t').textContent = g.title;
    li.querySelector('.d').textContent = g.desc;
    li.querySelector('.k').textContent = g.controls;
    list.appendChild(li);
  }
</script>
</body>
</html>
